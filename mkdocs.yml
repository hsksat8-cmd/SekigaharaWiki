site_name: 関ヶ原IF布陣シミュレータ Wiki
site_description: 関ヶ原IF布陣シミュレータの公式仕様・戦闘システム・陣形実験・シナリオ解説
site_url: https://hsksat8-cmd.github.io/SekigaharaWiki/
repo_url: https://github.com/hsksat8-cmd/SekigaharaWiki
repo_name: SekigaharaWiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える


nav:
  - ホーム: index.md
  - ゲーム:
      - 概要: game/overview.md
      - プレイモード: gameplay/modes.md
      - 観戦と字幕: gameplay/observation.md
      - 基本戦術: gameplay/tactics.md
      - サブシナリオ: gameplay/subscenarios.md
      - 戦績とランキング: gameplay/results-and-rankings.md
  - 戦闘システム:
      - 概要: systems/index.md
      - 士気: systems/morale.md
      - ダメージ計算: systems/damage.md
      - 包囲と中央突破: systems/encirclement.md
      - 部隊規模と各個撃破: systems/unit-size.md
      - 部隊AI: systems/ai.md
  - 陣形:
      - 概要: formations/index.md
      - 方形: formations/square.md
      - 方形自由: formations/flexible-square.md
      - 鶴翼: formations/crane-wing.md
      - 縦深: formations/deep.md
      - 魚鱗: formations/fish-scale.md
  - シナリオ:
      - 一覧: scenarios/index.md
      - 史実寄り: scenarios/historical.md
      - 毛利積極参戦: scenarios/mori-active.md
      - 島津積極策: scenarios/shimazu-active.md
      - 小早川西軍積極参戦: scenarios/kobayakawa-western.md
      - 毛利・小早川西軍積極参戦: scenarios/mori-kobayakawa-western.md
      - 完全ランダム: scenarios/random.md
      - ランダム架空大戦: scenarios/random-fictional-war.md
  - 陣形実験:
      - 実験方法: experiments/index.md
      - 縦深 対 方形: experiments/deep-vs-square.md
  - 更新履歴:
      - 一覧: updates/index.md
      - Version 2.2.0: updates/v2.2.0.md
      - Version 2.1.0: updates/v2.1.0.md
      - Version 2.0.x: updates/v2.0.md
      - Version 1.2.0: updates/v1.2.0.md
  - 資料:
      - 動画・投稿一覧: reference/media.md
      - 画像ギャラリー: reference/gallery.md
      - X投稿アーカイブ: reference/tweets.md
      - 用語集: reference/glossary.md
      - プライバシー: privacy.md
  - English:
      - Home: en/index.md
      - Game:
          - Overview: en/game/overview.md
          - Play Modes: en/gameplay/modes.md
          - Observation and Subtitles: en/gameplay/observation.md
          - Basic Tactics: en/gameplay/tactics.md
          - Sub-Scenarios: en/gameplay/subscenarios.md
          - Results and Rankings: en/gameplay/results-and-rankings.md
      - Battle System:
          - Overview: en/systems/index.md
          - Morale: en/systems/morale.md
          - Damage Calculation: en/systems/damage.md
          - Encirclement and Breakthrough: en/systems/encirclement.md
          - Unit Size: en/systems/unit-size.md
          - Unit AI: en/systems/ai.md
      - Formations:
          - Overview: en/formations/index.md
          - Square: en/formations/square.md
          - Flexible Square: en/formations/flexible-square.md
          - Crane Wing: en/formations/crane-wing.md
          - Deep: en/formations/deep.md
          - Fish Scale: en/formations/fish-scale.md
      - Scenarios:
          - List: en/scenarios/index.md
          - Historically Inspired: en/scenarios/historical.md
          - Active Mori: en/scenarios/mori-active.md
          - Active Shimazu: en/scenarios/shimazu-active.md
          - Kobayakawa Western: en/scenarios/kobayakawa-western.md
          - Mori and Kobayakawa Western: en/scenarios/mori-kobayakawa-western.md
          - Fully Random: en/scenarios/random.md
          - Random Fictional Grand Battle: en/scenarios/random-fictional-war.md
      - Experiments:
          - Method: en/experiments/index.md
          - Deep vs. Square: en/experiments/deep-vs-square.md
      - Updates:
          - History: en/updates/index.md
          - Version 2.2.0: en/updates/v2.2.0.md
          - Version 2.1.0: en/updates/v2.1.0.md
          - Version 2.0.x: en/updates/v2.0.md
          - Version 1.2.0: en/updates/v1.2.0.md
      - Reference:
          - Image Gallery: en/reference/gallery.md
          - Glossary: en/reference/glossary.md
          - Privacy: en/privacy.md

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/outbound-links.js

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/IFHistorySim
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@IFHistorySim
  analytics_notice: "Cloudflare Web Analyticsを使用します。Cookieは使用しません。"
