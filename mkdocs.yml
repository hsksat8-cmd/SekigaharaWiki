plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/outbound-links.js

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/IFHistorySim
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@IFHistorySim
  analytics_notice: "Cloudflare Web Analyticsを使用します。Cookieは使用しません。"
