site_name: 関ヶ原IF布陣シミュレータ Wiki
site_description: 関ヶ原IF布陣シミュレータの公式仕様・戦闘システム・陣形・シナリオ解説
site_url: https://hsksat8-cmd.github.io/SekigaharaWiki/
repo_url: https://github.com/hsksat8-cmd/SekigaharaWiki
repo_name: SekigaharaWiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える


