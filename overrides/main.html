{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <!--
    Cloudflare Web Analytics
    1. Cloudflare DashboardでWeb Analyticsのサイトを追加します。
    2. 下の YOUR_CLOUDFLARE_WEB_ANALYTICS_TOKEN を実際のトークンに置換します。
    3. トークン設定前はこのscript全体をコメントアウトしても構いません。
  -->
  <script
    defer
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"YOUR_CLOUDFLARE_WEB_ANALYTICS_TOKEN"}'>
  </script>

  <meta name="theme-color" content="#5d4037">
{% endblock %}

{% block announce %}
  公式Wikiの内容は、ゲームの更新により変更される場合があります。
{% endblock %}
